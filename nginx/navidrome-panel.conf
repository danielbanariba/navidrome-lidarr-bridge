server {
    listen 4534;
    server_name _;

    # Navidrome has no hook for adding anything to its web UI, so the panel is
    # injected into the HTML on its way to the browser. Doing it here rather
    # than in a userscript means every browser and phone gets it with nothing
    # installed.
    #
    # Navidrome itself is untouched: it keeps serving 4533 as before.

    resolver 127.0.0.11 valid=30s;

    # The bridge, proxied under this same origin so the panel needs no CORS and
    # works from clients that cannot reach port 8687.
    location = /panel.user.js {
        proxy_pass http://navidrome-lidarr-bridge:8687/panel.user.js;
    }

    location /ndlb/ {
        proxy_pass http://navidrome-lidarr-bridge:8687/;
        proxy_set_header Host $host;

        # POST /request for a band Lidarr has never imported adds the artist,
        # waits up to IMPORT_WAIT_SECONDS (45) for the discography to arrive,
        # then reads the monitored flag back on the artist and on the album with
        # a 1..6s backoff each — about ninety seconds before the first byte of
        # the answer. nginx's default read timeout is 60s, and the 3600s below
        # belongs to location / (Navidrome), not here: the proxy hung up first
        # and the panel painted a red "Failed" over a request that had worked
        # and was already downloading.
        #
        # Every artist the panel's search reaches is one Lidarr has never
        # imported, so this is that feature's ordinary path, not its edge case.
        # Kept above the browser's own 150s abort, so a timeout on screen always
        # means the bridge is genuinely still working rather than that nginx
        # gave up on it.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://host.docker.internal:4533;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Navidrome streams audio and uses websockets for playback events.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 0;

        # sub_filter cannot rewrite a compressed body, so ask upstream for plain
        # text. Only the HTML shell is affected; audio is not touched by either
        # this or sub_filter, which only runs on text/html.
        proxy_set_header Accept-Encoding "";

        # text/html is already sub_filter's default, and naming it again is a
        # duplicate-MIME-type warning on every start.
        sub_filter_once on;
        sub_filter '</head>'
            '<script>window.__NDLB_BASE="/ndlb";</script><script src="/panel.user.js" defer></script></head>';
    }
}
